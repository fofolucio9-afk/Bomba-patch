<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bomba Patch Mobile 26/27</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#07120b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}button{border:2px solid #f4cf28;background:#171717;color:#fff;font-weight:900;border-radius:10px;padding:12px 18px;font-size:clamp(14px,2.5vw,22px);box-shadow:0 4px 0 #705b00}button:active{transform:translateY(3px);box-shadow:none}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.hidden{display:none!important}.menu{background:radial-gradient(ellipse at center,#205a2a 0%,#0b2512 60%,#050806 100%);flex-direction:column;text-align:center;gap:14px;padding:18px}.logo{font-weight:1000;font-style:italic;line-height:.9;color:#ffe333;text-shadow:4px 4px #bd1b16,7px 7px #000;font-size:clamp(32px,8vw,78px)}.sub{letter-spacing:4px;font-weight:bold;color:#eee}.menuButtons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.tiny{font-size:12px;color:#ddd}.game{background:#07120b}.hud{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:bold;text-shadow:2px 2px #000;z-index:2}.controls{position:absolute;inset:0;pointer-events:none}.pad{position:absolute;left:18px;bottom:18px;display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:52px 52px 52px;gap:4px;pointer-events:auto}.pad button{padding:0;background:#111c;color:white;border-color:#ffffff88;box-shadow:none;opacity:.9}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.shoot{position:absolute;right:24px;bottom:35px;width:100px;height:100px;border-radius:50%;background:#b7191e;border-color:#ffe333;pointer-events:auto}.topbtn{position:absolute;top:10px;left:10px;pointer-events:auto;font-size:13px;padding:8px 10px}
</style></head><body>
<div id="menu" class="screen menu"><div class="sub">EDIÇÃO MOBILE 2026/27</div><div class="logo">BOMBA<br>PATCH</div><div style="font-size:clamp(14px,3vw,25px);font-weight:900">FUTEBOL RAIZ. É GOL!</div><div class="menuButtons"><button id="play">▶ PARTIDA RÁPIDA</button><button id="teams">⚽ TIMES</button><button id="about">ℹ SOBRE</button></div><div class="tiny">PROTÓTIPO 0.1 • FEITO PARA ANDROID</div></div>
<div id="teamScreen" class="screen menu hidden"><div class="logo" style="font-size:clamp(28px,6vw,56px)">ESCOLHA O TIME</div><div class="menuButtons"><button data-team="BRASIL">🇧🇷 BRASIL</button><button data-team="BOTAFOGO">BOTAFOGO</button><button data-team="FLAMENGO">FLAMENGO</button><button data-team="CORINTHIANS">CORINTHIANS</button></div><button id="back">VOLTAR</button></div>
<div id="aboutScreen" class="screen menu hidden"><div class="logo" style="font-size:clamp(26px,6vw,54px)">BOMBA PATCH</div><p>Protótipo inicial para celular.<br>Esta versão é um mini-jogo 2D de testes.</p><button id="aboutBack">VOLTAR</button></div>
<div id="game" class="screen game hidden"><canvas id="field"></canvas><div class="hud" id="hud">BOMBA PATCH MOBILE • 0 - 0 • 00:00</div><button class="topbtn" id="quit">MENU</button><div class="controls"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="right" data-dir="right">▶</button><button class="down" data-dir="down">▼</button></div><button class="shoot" id="shoot">CHUTAR</button></div></div>
<script>
const $=id=>document.getElementById(id);let selectedTeam="BRASIL",score=0,seconds=0,running=false,keys={},player={x:.35,y:.5,r:15},ball={x:.43,y:.5,vx:0,vy:0,r:8},last=0;
function show(id){["menu","teamScreen","aboutScreen","game"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
$("play").onclick=()=>{resetGame();show("game")};$("teams").onclick=()=>show("teamScreen");$("about").onclick=()=>show("aboutScreen");$("back").onclick=()=>show("menu");$("aboutBack").onclick=()=>show("menu");$("quit").onclick=()=>{running=false;show("menu")};
document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{selectedTeam=b.dataset.team; $("teams").textContent="⚽ TIME: "+selectedTeam;show("menu")});
const canvas=$("field"),ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener("resize",resize);resize();
function resetGame(){score=0;seconds=0;player={x:.35,y:.5,r:15};ball={x:.43,y:.5,vx:0,vy:0,r:8};running=true;last=performance.now();requestAnimationFrame(loop)}
function field(){let w=innerWidth,h=innerHeight;ctx.fillStyle="#12652d";ctx.fillRect(0,0,w,h);let stripe= Math.max(35,w/10);for(let i=0;i<10;i++){ctx.fillStyle=i%2?"#167235":"#1a7b39";ctx.fillRect(i*stripe,0,stripe+1,h)}ctx.strokeStyle="#f3f1d8";ctx.lineWidth=3;ctx.strokeRect(w*.05,h*.08,w*.9,h*.84);ctx.beginPath();ctx.moveTo(w*.5,h*.08);ctx.lineTo(w*.5,h*.92);ctx.stroke();ctx.beginPath();ctx.arc(w*.5,h*.5,h*.12,0,Math.PI*2);ctx.stroke();ctx.strokeRect(w*.05,h*.32,w*.14,h*.36);ctx.strokeRect(w*.81,h*.32,w*.14,h*.36);ctx.strokeRect(w*.05,h*.42,w*.05,h*.16);ctx.strokeRect(w*.9,h*.42,w*.05,h*.16)}
function drawPlayer(x,y,color,label){let w=innerWidth,h=innerHeight;ctx.fillStyle="#0006";ctx.beginPath();ctx.ellipse(x*w,y*h+10,15,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(x*w,y*h,player.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#fff";ctx.font="bold 11px Arial";ctx.textAlign="center";ctx.fillText(label,x*w,y*h+4)}
function render(){field();drawPlayer(player.x,player.y,"#f5f5f5","10");drawPlayer(.72,.47,"#d52a2a","9");let w=innerWidth,h=innerHeight;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ball.x*w,ball.y*h,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#222";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#111";ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.fillText("⬟",ball.x*w,ball.y*h+3);$("hud").textContent=selectedTeam+"  "+score+" - 0  •  "+String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(Math.floor(seconds%60)).padStart(2,"0")}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.04);last=t;seconds+=dt;let speed=.32*dt;if(keys.up)player.y-=speed;if(keys.down)player.y+=speed;if(keys.left)player.x-=speed;if(keys.right)player.x+=speed;player.x=Math.max(.07,Math.min(.93,player.x));player.y=Math.max(.1,Math.min(.9,player.y));ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.12,dt);ball.vy*=Math.pow(.12,dt);if(ball.y<.1||ball.y>.9)ball.vy*=-.75;if(ball.x<.05){if(ball.y>.42&&ball.y<.58){score++;ball.x=.43;ball.y=.5;ball.vx=ball.vy=0}else{ball.x=.06;ball.vx=Math.abs(ball.vx)*.7}}if(ball.x>.95){ball.x=.94;ball.vx=-Math.abs(ball.vx)*.7}render();requestAnimationFrame(loop)}
document.querySelectorAll("[data-dir]").forEach(b=>{let d=b.dataset.dir;const on=e=>{e.preventDefault();keys[d]=true},off=e=>{e.preventDefault();keys[d]=false};b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off)});
addEventListener("keydown",e=>{let map={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};if(map[e.key])keys[map[e.key]]=true;if(e.code==="Space")kick()});addEventListener("keyup",e=>{let map={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};if(map[e.key])keys[map[e.key]]=false});
function kick(){let dx=ball.x-player.x,dy=ball.y-player.y;if(Math.hypot(dx*innerWidth,dy*innerHeight)<90){let m=Math.hypot(dx,dy)||1;ball.vx=(dx/m)*1.35;ball.vy=(dy/m)*1.35;if(ball.x>.86&&ball.y>.42&&ball.y<.58){score++;ball.x=.43;ball.y=.5;ball.vx=ball.vy=0}}}
$("shoot").addEventListener("pointerdown",e=>{e.preventDefault();kick()});
</script></body></html>
